line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

# Qt virtual methods retain their framework names and immutable QModelIndex defaults.
[lint.per-file-ignores]
"src/winlink/ui/*.py" = ["N802", "B008"]
"src/winlink/ui/dialogs/*.py" = ["N802", "B008"]
