[project]
name = "winlink"
version = "0.1.5"
description = "Gerenciador de junções para Windows 11"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "pywin32>=306",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psutil>=7.2.2",
]

[project.scripts]
winlink = "winlink.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
]
build = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winlink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyqt6"

# Upstream Qt 6.12 stubs contain invalid positional-only vararg signatures.
# Keep application checks enabled; treat Qt imports as external untyped APIs.
[[tool.mypy.overrides]]
module = ["PyQt6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
